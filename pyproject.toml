[project]
name = "national-inspection-platform"
version = "0.1.0"
description = "National Inspection Platform — controlled implementation of Vertical Slice 01 (S01-I01)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "Django~=5.2.0",
    "psycopg[binary]~=3.2",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
    "ruff~=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The application is run from the repository root; no package is installed.
py-modules = []

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["config", "identity", "tests"]
# Auto-generated migration files are not lint targets; their shape is owned by Django.
exclude = ["identity/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    # Django settings modules legitimately import * for star-configuration.
    "F403",
    "F405",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "identity"]

# --- pytest ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "identity"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: marks tests that require a PostgreSQL backend.",
]