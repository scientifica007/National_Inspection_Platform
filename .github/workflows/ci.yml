name: CI

on:
  push:
    branches: ["build/**"]
  pull_request:
    branches: ["main"]

# Minimum permissions: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, checks and tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: national_inspection
          POSTGRES_USER: national_inspection
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U national_inspection"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: national_inspection
      POSTGRES_USER: national_inspection
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Pending migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite (PostgreSQL)
        run: pytest -q